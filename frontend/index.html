<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pedidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="header">
    <h1>Gestión de Pedidos</h1>
    <p>Sistema Distribuido Tolerante a Fallos</p>
  </div>

  <div class="container">

    <!-- FORM PANEL -->
    <div class="form-panel" id="formPanel">
      <span class="edit-mode-badge">● Editando</span>
      <h2 id="formTitle">Nuevo Pedido</h2>

      <div class="form-group">
        <label>Cliente</label>
        <input name="customer" id="f-customer" type="text" placeholder="Nombre del cliente" required>
      </div>

      <div class="form-group">
        <label>Producto</label>
        <input name="product" id="f-product" type="text" placeholder="Nombre del producto" required>
      </div>

      <div class="form-group">
        <label>Cantidad</label>
        <input name="amount" id="f-amount" type="number" placeholder="0" min="1" required>
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select name="state" id="f-state">
          <option value="Pendiente">Pendiente</option>
          <option value="En proceso">En proceso</option>
          <option value="Enviado">Enviado</option>
          <option value="Entregado">Entregado</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha</label>
        <input name="start_date" id="f-date" type="date" required>
      </div>

      <button class="btn btn-primary" id="btnSubmit" onclick="submitForm()">
        Guardar Pedido
      </button>
      <button class="btn btn-cancel" id="btnCancel" onclick="cancelEdit()" style="display:none">
        Cancelar edición
      </button>
    </div>

    <!-- TABLE PANEL -->
    <div class="table-panel">
      <div class="table-header">
        <h2>Lista de Pedidos</h2>
        <span class="count-badge" id="countBadge">0 pedidos</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Estado</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaPedidos"></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>

</body>
</html>
